<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1c1e" />
  <title>Estadio da Gruz — Wirtualny Spacer 3D (Stadion ŁKS 1969-2012)</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="loading" class="overlay">
    <div class="loader-card">
      <div class="badge">ŁKS ŁÓDŹ • 1969–2012</div>
      <h1>ESTADIO DA GRUZ</h1>
      <p class="subtitle">Wirtualna rekonstrukcja architektoniczna 3D</p>
      <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
      <div class="status" id="loading-status">Wczytywanie geometrii stadionu...</div>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="hud-top-left">
      <div class="app-title">ESTADIO DA GRUZ</div>
      <div class="location-badge" id="hud-location">Środek Murawy</div>
    </div>

    <div class="hud-top-right">
      <button id="btn-light" class="btn-icon" title="Przełącz oświetlenie (Dzień / Noc [L])">
        <span id="light-icon">☀️</span> <span id="light-label">Dzień</span>
      </button>
      <button id="btn-mode" class="btn-icon" title="Przełącz tryb (Spacer / Dron [V])">
        <span id="mode-icon">🚶</span> <span id="mode-label">Spacer</span>
      </button>
    </div>

    <div class="hud-bottom-bar">
      <div class="viewpoints-menu">
        <button class="vp-btn" data-vp="0"><span class="key">1</span> Murawa</button>
        <button class="vp-btn" data-vp="1"><span class="key">2</span> Korona Trybuny</button>
        <button class="vp-btn" data-vp="2"><span class="key">3</span> Sektor VIP</button>
        <button class="vp-btn" data-vp="3"><span class="key">4</span> Zegar (Południe)</button>
        <button class="vp-btn" data-vp="4"><span class="key">5</span> Galera (Al. Unii)</button>
        <button class="vp-btn" data-vp="5"><span class="key">6</span> Jupiter NW</button>
        <button class="vp-btn" data-vp="6"><span class="key">7</span> Bramka & Siatka</button>
      </div>
      <div class="hint">Kliknij ekran, aby przejąć mysz • WASD poruszanie • Spacja skok/wznoszenie</div>
    </div>
  </div>

  <div id="reticle" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
